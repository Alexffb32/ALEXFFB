<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comunidade, Alexandre Bento</title>
<meta name="description" content="Uma rede de jovens empreendedores que preferem construir a esperar. Entra na waitlist.">
<link rel="canonical" href="https://alexffb.com/comunidade">
<link rel="icon" href="/framerusercontent.com/images/HAVYGe4Xw2zOYeUi5OP4GS7xLk.png">
<link rel="stylesheet" href="/assets/waitlist.css">
</head>
<body class="wl-body">
  <header class="wl-header">
    <a href="/" class="wl-logo">Alexandre Bento</a>
    <a href="/" class="wl-back">← Voltar ao site</a>
  </header>

  <main class="wl-main">
    <div class="wl-card">
      <p class="wl-kicker">Comunidade</p>
      <h1 class="wl-title">Comunidade</h1>
      <p class="wl-lede">Uma rede de jovens empreendedores que preferem construir a esperar.<br><strong>Brevemente.</strong></p>

      <form id="waitlist-form" class="wl-form" data-list="comunidade">
        <input type="text" name="company" class="wl-honeypot" tabindex="-1" autocomplete="off" aria-hidden="true">
        <input type="text" name="name" class="wl-input" placeholder="O teu nome" required>
        <input type="email" name="email" class="wl-input" placeholder="O teu melhor email" required>
        <label class="wl-consent">
          <input type="checkbox" name="consent" required>
          <span>Li e aceito a <a href="/privacidade/" target="_blank" rel="noopener noreferrer">Política de Privacidade</a> e os <a href="/termos/" target="_blank" rel="noopener noreferrer">Termos e Condições</a>.</span>
        </label>
        <button type="submit" class="wl-submit">Entra na waitlist</button>
      </form>
      <p id="waitlist-message" class="wl-message" role="status"></p>
    </div>
  </main>

  <footer class="wl-footer">
    <div class="wl-footer-legal">
      <a href="/privacidade/">Política de Privacidade</a>
      <a href="/cookies/">Política de Cookies</a>
      <a href="/termos/">Termos e Condições</a>
    </div>
    Alexandre Bento © 2026. Todos os direitos reservados.
  </footer>

  <script src="/assets/waitlist.js"></script>
</body>
</html>
