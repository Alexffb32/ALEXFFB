<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Merch, Alexandre Bento</title>
<meta name="description" content="Anti University Social Club, a primeira coleção. Streetwear para quem constrói o próprio caminho. Entra na waitlist.">
<link rel="canonical" href="https://alexffb.com/merch">
<link rel="icon" href="/framerusercontent.com/images/HAVYGe4Xw2zOYeUi5OP4GS7xLk.png">
<link rel="stylesheet" href="/assets/waitlist.css">
</head>
<body class="wl-body">
  <header class="wl-header">
    <a href="/" class="wl-logo">Alexandre Bento</a>
    <a href="/" class="wl-back">← Voltar ao site</a>
  </header>

  <main class="wl-main">
    <div class="wl-card">
      <p class="wl-kicker">Merch</p>
      <h1 class="wl-title">Anti University<br>Social Club</h1>
      <p class="wl-lede">A primeira coleção. Streetwear para quem constrói o próprio caminho.<br><strong>Lançamento: 7 de setembro, segunda-feira.</strong></p>

      <div id="wl-countdown" class="wl-countdown" data-deadline="2026-09-07T19:00:00+01:00" aria-live="polite">
        <div class="wl-countdown-unit"><span class="wl-countdown-num" data-unit="days">00</span><span class="wl-countdown-label">Dias</span></div>
        <div class="wl-countdown-unit"><span class="wl-countdown-num" data-unit="hours">00</span><span class="wl-countdown-label">Horas</span></div>
        <div class="wl-countdown-unit"><span class="wl-countdown-num" data-unit="minutes">00</span><span class="wl-countdown-label">Min</span></div>
        <div class="wl-countdown-unit"><span class="wl-countdown-num" data-unit="seconds">00</span><span class="wl-countdown-label">Seg</span></div>
      </div>
      <p id="wl-countdown-live" class="wl-countdown-live" hidden>A coleção já está disponível.</p>

      <form id="waitlist-form" class="wl-form" data-list="merch">
        <input type="text" name="company" class="wl-honeypot" tabindex="-1" autocomplete="off" aria-hidden="true">
        <input type="text" name="name" class="wl-input" placeholder="O teu nome" required>
        <input type="email" name="email" class="wl-input" placeholder="O teu melhor email" required>
        <button type="submit" class="wl-submit">Entra na waitlist</button>
      </form>
      <p id="waitlist-message" class="wl-message" role="status"></p>
    </div>
  </main>

  <footer class="wl-footer">Alexandre Bento © 2026. Todos os direitos reservados.</footer>

  <script src="/assets/waitlist.js"></script>
  <script src="/assets/countdown.js"></script>
</body>
</html>
